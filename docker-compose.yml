  redisnode50:
    image: redis:7.4
    container_name: redisnode50
    hostname: redisnode50
    ports:
      - "7004:6379"
      - "17004:16379"
    mem_limit: 2g
    depends_on:
      redisnode40:
        condition: service_healthy
    volumes:
      - ./data/redisnode50:/data
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
