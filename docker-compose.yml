      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ==========================================
  # REDIS CLUSTER - NODE 60
  # ==========================================
  redisnode60:
    image: redis:7.4
    container_name: redisnode60
    hostname: redisnode60
    ports:
      - "7005:6379"
      - "17005:16379"
    mem_limit: 2g
    depends_on:
      redisnode50:
        condition: service_healthy
    volumes:
      - ./data/redisnode60:/data
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --port 6379
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ==========================================
  # REDIS CLUSTER INITIALIZATION
  # ==========================================
  redis-cluster-init:
    image: redis:7.4
    container_name: redis-cluster-init
    depends_on:
      redisnode10:
        condition: service_healthy
      redisnode20:
        condition: service_healthy
      redisnode30:
        condition: service_healthy
      redisnode40:
        condition: service_healthy
      redisnode50:
        condition: service_healthy
      redisnode60:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if redis-cli -h redisnode10 cluster info | grep -q 'cluster_state:ok'; then
          echo 'Redis Cluster already initialized';
        else
          echo yes | redis-cli --cluster create \
            redisnode10:6379 \
            redisnode20:6379 \
            redisnode30:6379 \
            redisnode40:6379 \
            redisnode50:6379 \
            redisnode60:6379 \
            --cluster-replicas 1;
        fi
    restart: "no"

volumes:
  cassandra_data:
